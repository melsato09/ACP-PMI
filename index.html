<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudos PMI-ACP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --mindset:#6d4fd8; --leadership:#d0612b; --product:#16897a; --delivery:#2a63c4;
  --ok:#1f8a4c; --bad:#c23b3b; --accent:#1d1b18;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16150f; --card:#211f19; --ink:#f1ede4; --muted:#a59f93; --line:#353128; --accent:#f1ede4;
    --mindset:#9d86f0; --leadership:#ee8c5a; --product:#3fc0ad; --delivery:#6d9cf0; --ok:#4cc27e; --bad:#ec6b6b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.4rem} h3{font-size:1.08rem;margin-top:1.4em}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:14px 18px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.2rem;margin-right:auto}
.brand span{color:var(--muted);font-weight:500}
nav{max-width:980px;margin:0 auto;padding:8px 12px 0;display:flex;gap:2px;overflow-x:auto}
nav a{padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav a.on{color:var(--ink);border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:24px 18px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.muted{color:var(--muted)} .small{font-size:.88rem}
.dom{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--ink);padding:10px 14px;margin-top:12px;background:color-mix(in srgb,var(--ink) 4%,var(--card));border-radius:0 8px 8px 0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ink)}
.summary ul{padding-left:1.2em;margin:.4em 0} .summary li{margin:.25em 0}
.summary table{border-collapse:collapse;width:100%;font-size:.93rem;margin:.6em 0}
.summary td,.summary th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.summary th{background:color-mix(in srgb,var(--ink) 5%,var(--card))}
.tip{background:color-mix(in srgb,#e8b931 18%,var(--card));border:1px solid color-mix(in srgb,#e8b931 50%,var(--line));border-radius:10px;padding:10px 14px;margin:12px 0}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;padding:30px}
.flash .term{font-family:Fraunces,serif;font-size:1.6rem;font-weight:700}
.flash .def{font-size:1.05rem;max-width:620px}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer}
.qnav button.ans{background:color-mix(in srgb,var(--ink) 14%,var(--card))}
.qnav button.cur{outline:2px solid var(--ink)}
.qnav button.flag{border-color:#e8a317;border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.stat{font-family:Fraunces,serif;font-size:2rem;font-weight:700}
.dbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .card{max-width:420px}
.rev{border-top:1px solid var(--line);padding:14px 0}
</style>
</head>
<body>
<header>
  <div class="bar"><div class="brand">PMI-ACP <span>· caderno de estudos</span></div></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modal"></div>

<script>
// ================== DADOS ==================
const DOM = {
  mindset:{nome:'Mindset',peso:28,cor:'var(--mindset)'},
  leadership:{nome:'Leadership',peso:25,cor:'var(--leadership)'},
  product:{nome:'Product',peso:19,cor:'var(--product)'},
  delivery:{nome:'Delivery',peso:28,cor:'var(--delivery)'}
};
const domTag = d => `<span class="dom" style="background:${DOM[d].cor}">${DOM[d].nome}</span>`;

const RESUMOS = {
mindset:`
<p class="muted">O domínio com mais peso, junto com Delivery. Aqui a prova verifica se você <b>pensa</b> de forma ágil, e não só se conhece as cerimônias.</p>
<h3>Manifesto Ágil: os 4 valores</h3>
<ul>
<li><b>Indivíduos e interações</b> mais que processos e ferramentas</li>
<li><b>Software em funcionamento</b> mais que documentação abrangente</li>
<li><b>Colaboração com o cliente</b> mais que negociação de contratos</li>
<li><b>Responder a mudanças</b> mais que seguir um plano</li>
</ul>
<p class="small muted">Os itens à direita continuam tendo valor. Os da esquerda é que valem mais.</p>
<h3>Os 12 princípios (resumidos)</h3>
<ol class="small">
<li>Prioridade: satisfazer o cliente com entregas cedo e contínuas de valor.</li>
<li>Mudanças de requisito são bem-vindas, mesmo tarde, como vantagem competitiva.</li>
<li>Entregar com frequência: semanas em vez de meses.</li>
<li>Negócio e desenvolvimento trabalham juntos diariamente.</li>
<li>Construir em torno de pessoas motivadas: dar ambiente, apoio e confiança.</li>
<li>Conversa face a face é o meio mais eficaz de comunicação.</li>
<li>Produto funcionando é a principal medida de progresso.</li>
<li>Ritmo sustentável, que possa ser mantido indefinidamente.</li>
<li>Atenção contínua à excelência técnica e ao bom design.</li>
<li>Simplicidade: maximizar o trabalho que <i>não</i> precisa ser feito.</li>
<li>As melhores arquiteturas e designs emergem de equipes auto-organizadas.</li>
<li>Em intervalos regulares, a equipe reflete e ajusta seu comportamento.</li>
</ol>
<h3>Comportamentos da mentalidade ágil</h3>
<ul>
<li><b>Ser ágil vs. fazer ágil:</b> praticar cerimônias sem a mentalidade não gera agilidade.</li>
<li><b>Foco em valor e resultados</b>, não em produção de artefatos.</li>
<li><b>Transparência:</b> trabalho visível (quadros, radiadores de informação), problemas expostos cedo.</li>
<li><b>Segurança psicológica:</b> as pessoas podem errar, discordar e perguntar sem medo. É a base para inspeção e adaptação.</li>
<li><b>Mentalidade de crescimento e experimentação:</b> hipótese → experimento curto → aprendizado validado. "Falhar rápido" significa aprender barato.</li>
<li><b>Pensamento sistêmico:</b> olhar o fluxo ponta a ponta. Muitas causas de problema estão no sistema, não nas pessoas.</li>
<li><b>Melhoria contínua (Kaizen)</b> como hábito, não como evento.</li>
</ul>
<h3>Complexidade e escolha de abordagem</h3>
<table>
<tr><th>Cynefin</th><th>Característica</th><th>Resposta</th></tr>
<tr><td>Claro</td><td>Causa e efeito óbvios</td><td>Perceber → categorizar → responder (boas práticas)</td></tr>
<tr><td>Complicado</td><td>Exige análise/especialista</td><td>Perceber → analisar → responder</td></tr>
<tr><td>Complexo</td><td>Causa e efeito só visíveis em retrospecto</td><td>Sondar → perceber → responder (experimentos). <b>É onde o ágil brilha.</b></td></tr>
<tr><td>Caótico</td><td>Sem relação discernível</td><td>Agir → perceber → responder (estabilizar primeiro)</td></tr>
</table>
<ul>
<li><b>Matriz de Stacey:</b> incerteza de requisitos × incerteza técnica. Quanto mais incerto, mais adequado o ágil.</li>
<li><b>Ciclos de vida:</b> preditivo, iterativo, incremental, ágil (iterativo + incremental) e <b>híbrido</b>.</li>
<li><b>Tailoring:</b> adaptar o método ao contexto (cultura, equipe, regulação, risco). Não existe um método único para tudo.</li>
</ul>
<h3>Agilidade empresarial (Enterprise Agility)</h3>
<ul>
<li>Agilidade além das equipes: portfólio, financiamento, RH, governança, liderança.</li>
<li>Financiar <b>produtos e fluxos de valor</b> em vez de projetos com escopo fixo anual.</li>
<li>Equipes estáveis e de longa duração; o trabalho vai até a equipe, e não o contrário.</li>
<li>Frameworks de escala: SAFe, LeSS, Disciplined Agile, Scrum@Scale, Nexus. Saber que existem e para que servem basta.</li>
<li>A liderança precisa mudar de comando e controle para propósito, contexto e remoção de restrições sistêmicas.</li>
</ul>
<div class="tip"><b>Na prova:</b> a resposta "ágil" costuma ser a que preserva a colaboração, aceita a mudança com base em valor, cria transparência e trata erro como aprendizado. Desconfie de opções que punem, escondem informação ou impõem processo de cima para baixo.</div>
`,
leadership:`
<p class="muted">25% da prova. Trata da liderança servidora, do desenvolvimento da equipe, de conflitos e do engajamento de stakeholders.</p>
<h3>Liderança servidora</h3>
<ul>
<li>Serve primeiro e lidera depois: <b>remove impedimentos</b>, protege a equipe de interrupções, facilita, faz coaching e cria um ambiente de confiança.</li>
<li>Não é passividade: o líder servidor dá propósito e contexto e cobra os acordos.</li>
<li>Prefere <b>perguntar e facilitar</b> a decidir pela equipe.</li>
</ul>
<h3>Equipes auto-organizadas e empoderadas</h3>
<ul>
<li>A equipe decide <i>como</i> fazer o trabalho; o PO decide <i>o que</i> tem mais valor.</li>
<li><b>Generalista-especialista (T-shaped):</b> profundidade em uma área e amplitude em várias. Reduz gargalos.</li>
<li><b>Acordos de trabalho / team charter:</b> criados pela própria equipe (valores, horários, comunicação, DoD).</li>
<li>Equipes estáveis, de 3 a 9 pessoas, multifuncionais e, idealmente, co-localizadas (comunicação osmótica).</li>
</ul>
<h3>Modelos de desenvolvimento</h3>
<table>
<tr><th>Tuckman</th><th>O que acontece</th><th>Papel do líder</th></tr>
<tr><td>Forming</td><td>Educação, incerteza</td><td>Dirigir: dar clareza, objetivos e papéis</td></tr>
<tr><td>Storming</td><td>Conflitos, disputa de papéis</td><td>Coaching: facilitar conflitos e acordos</td></tr>
<tr><td>Norming</td><td>Normas aceitas, coesão</td><td>Apoiar</td></tr>
<tr><td>Performing</td><td>Alta performance, autonomia</td><td>Delegar e sair do caminho</td></tr>
<tr><td>Adjourning</td><td>Encerramento</td><td>Reconhecer e celebrar</td></tr>
</table>
<ul>
<li><b>Shu-Ha-Ri:</b> Shu (segue as regras), Ha (adapta as regras), Ri (transcende as regras). O estilo de liderança acompanha: ensinar → orientar → aconselhar.</li>
<li><b>Liderança situacional:</b> dirigir, treinar, apoiar e delegar, conforme a maturidade.</li>
</ul>
<h3>Motivação (Daniel Pink)</h3>
<p><b>Autonomia, maestria e propósito</b> motivam trabalho criativo mais que recompensas extrínsecas. Bônus individuais ou por velocidade tendem a distorcer comportamentos.</p>
<h3>Níveis de conflito (Speed Leas)</h3>
<table>
<tr><th>Nível</th><th>Sinal</th><th>Abordagem</th></tr>
<tr><td>1. Problema a resolver</td><td>Foco no problema, informação aberta</td><td>Colaboração / consenso</td></tr>
<tr><td>2. Desacordo</td><td>Autoproteção, conversas em particular</td><td>Apoio, ajudar a dar voz, empoderar</td></tr>
<tr><td>3. Competição (contest)</td><td>Vencer passa a importar mais; formam-se lados</td><td>Facilitação, negociação, acomodação</td></tr>
<tr><td>4. Cruzada</td><td>Proteger o próprio grupo; ideologia</td><td>Diplomacia, mediação estruturada</td></tr>
<tr><td>5. Guerra mundial</td><td>Destruir o outro</td><td>Separar as partes, evitar danos</td></tr>
</table>
<p class="small">Nos níveis 1 e 2, o líder deixa a equipe resolver e só facilita.</p>
<h3>Inteligência emocional e comunicação</h3>
<ul>
<li>Autoconsciência, autogestão, consciência social e gestão de relacionamentos.</li>
<li>Elogios em público, conversas difíceis <b>em particular</b>.</li>
<li>Escuta ativa, perguntas poderosas e feedback específico sobre comportamento.</li>
</ul>
<h3>Tomada de decisão participativa</h3>
<ul>
<li><b>Fist of five / Roman voting / thumbs:</b> votação rápida; quem discorda explica a preocupação antes de seguir.</li>
<li><b>Dot voting / 100 pontos</b> para priorizar entre opções.</li>
<li><b>Delegation poker:</b> combina o nível de delegação de cada tipo de decisão (de "eu decido" até "a equipe decide").</li>
</ul>
<h3>Stakeholders e equipes distribuídas</h3>
<ul>
<li>Engajar cedo e com frequência: reviews, demos, radiadores de informação. Entender a preocupação de quem resiste.</li>
<li>Equipes distribuídas: horários de sobreposição, ferramentas de colaboração, acordos explícitos, encontro presencial inicial quando possível, câmeras ligadas.</li>
<li>Impedimentos organizacionais (aprovações lentas, dependências) são escalados e trabalhados pelo líder junto às áreas envolvidas.</li>
</ul>
<div class="tip"><b>Na prova:</b> a melhor ação quase nunca é "o líder decide", "escalar imediatamente" ou "repreender". Prefira facilitar, conversar com a pessoa, fazer coaching e deixar a equipe resolver, com o líder removendo obstáculos.</div>
`,
product:`
<p class="muted">19% da prova. Trata de visão, backlog, priorização por valor e validação com o cliente.</p>
<h3>Visão e roadmap</h3>
<ul>
<li><b>Visão do produto:</b> o porquê, para quem e qual o diferencial. Exemplos de ferramenta: elevator pitch, product box, product vision board.</li>
<li><b>Roadmap:</b> evolução planejada por temas ou resultados; é flexível e revisado com frequência.</li>
<li>Medir <b>resultados (outcomes)</b> como adoção, retenção, receita e satisfação, e não apenas <b>saídas (outputs)</b> como quantidade de features.</li>
</ul>
<h3>Product Owner e backlog</h3>
<ul>
<li>O PO maximiza o valor, ordena o backlog e é o ponto único de decisão sobre prioridade. Colabora com a equipe e os stakeholders.</li>
<li><b>Backlog DEEP:</b> Detalhado apropriadamente (topo mais detalhado), Estimado, Emergente, Priorizado.</li>
<li><b>Refinamento</b> contínuo e colaborativo, just-in-time. Nada de detalhar tudo meses antes.</li>
<li><b>Definition of Ready</b> (opcional): critério para um item entrar na sprint.</li>
</ul>
<h3>Histórias de usuário</h3>
<ul>
<li>Formato: <i>Como &lt;persona&gt;, quero &lt;ação&gt;, para &lt;benefício&gt;</i>.</li>
<li><b>3 Cs:</b> Cartão, Conversa, Confirmação (critérios de aceite).</li>
<li><b>INVEST:</b> Independente, Negociável, Valiosa, Estimável, Small (pequena), Testável.</li>
<li><b>Critérios de aceite</b> são específicos da história. Formato Gherkin: <i>Dado… Quando… Então…</i>. A <b>DoD</b> vale para todas as histórias.</li>
<li><b>Épico → feature → história → tarefa.</b> Fatiar <b>verticalmente</b> (uma fatia de valor ponta a ponta), não por camada técnica.</li>
<li>Formas de fatiar: por caminho do fluxo, regra de negócio, tipo de dado, operação (CRUD), caminho feliz vs. exceções, plataforma.</li>
</ul>
<h3>Priorização</h3>
<table>
<tr><th>Técnica</th><th>Ideia</th></tr>
<tr><td>MoSCoW</td><td>Must, Should, Could, Won't (desta vez)</td></tr>
<tr><td>Kano</td><td>Básicas (ausência irrita), de desempenho (mais é melhor), encantadoras (surpreendem), indiferentes</td></tr>
<tr><td>WSJF</td><td>Custo do atraso ÷ duração (ou tamanho). Maior WSJF primeiro</td></tr>
<tr><td>Valor × risco</td><td>Alto valor e alto risco primeiro (aprende cedo); baixo valor e alto risco, evitar</td></tr>
<tr><td>Dot voting / 100 pontos / comprar features</td><td>Stakeholders distribuem "moedas" entre os itens</td></tr>
<tr><td>ROI, VPL, TIR</td><td>Valor financeiro (maior é melhor; payback menor é melhor)</td></tr>
</table>
<h3>Descoberta e validação</h3>
<ul>
<li><b>MVP:</b> menor esforço para testar uma hipótese com usuários reais e aprender. <b>MMF</b> é a menor funcionalidade que já entrega valor ao mercado.</li>
<li><b>Personas:</b> usuários arquetípicos que orientam decisões. <b>Story mapping:</b> jornada do usuário na horizontal e detalhe na vertical; os cortes horizontais viram releases.</li>
<li><b>Desenvolvimento orientado a hipóteses:</b> "Acreditamos que X resultará em Y; saberemos quando ver Z".</li>
<li>Feedback frequente: reviews e demos, protótipos, wireframes, testes A/B, entrevistas.</li>
<li><b>Value Stream Mapping:</b> mapeia o fluxo ponta a ponta para achar espera e desperdício. Eficiência do ciclo = tempo de trabalho ÷ lead time.</li>
</ul>
<div class="tip"><b>Na prova:</b> se o cliente só vê o produto no fim, a resposta é antecipar o feedback. Se o PO prioriza sozinho e às cegas, a resposta é colaborar e usar critérios de valor. A prioridade é do PO, mas é informada pela equipe (risco e dependências) e pelos stakeholders.</div>

delivery:`
<p class="muted">28% da prova. Trata de como o trabalho flui: cadências, fluxo, estimativa, métricas, qualidade e riscos.</p>
<h3>Scrum em uma tabela</h3>
<table>
<tr><th>Elemento</th><th>Resumo</th></tr>
<tr><td>Papéis</td><td>Product Owner, Scrum Master e Developers</td></tr>
<tr><td>Sprint</td><td>Até 1 mês, cadência fixa. Escopo negociável, objetivo estável</td></tr>
<tr><td>Planning</td><td>Por quê (meta), o quê e como. Até 8h para sprint de 1 mês</td></tr>
<tr><td>Daily</td><td>15 min, da equipe para a equipe: progresso rumo à meta e impedimentos</td></tr>
<tr><td>Review</td><td>Inspecionar o incremento com stakeholders e adaptar o backlog (até 4h)</td></tr>
<tr><td>Retrospectiva</td><td>Inspecionar o processo e escolher melhorias (até 3h)</td></tr>
<tr><td>Artefatos</td><td>Product backlog (meta do produto), sprint backlog (meta da sprint), incremento (DoD)</td></tr>
</table>
<p class="small">Se surge um pedido urgente no meio da sprint, ele vai para o PO. Só o PO pode cancelar uma sprint, quando a meta se torna obsoleta.</p>
<h3>Kanban e Lean</h3>
<ul>
<li>Práticas Kanban: visualizar o fluxo, <b>limitar o WIP</b>, gerenciar o fluxo, políticas explícitas, ciclos de feedback e melhoria colaborativa. Sistema <b>puxado</b>.</li>
<li>"Pare de começar, comece a terminar."</li>
<li><b>Desperdícios Lean</b> (software): trabalho parcialmente feito, funcionalidades extras, reaprendizado, handoffs, atrasos/espera, troca de tarefas, defeitos. Pense em DOWNTIME.</li>
<li>Princípios Lean: eliminar desperdício, qualidade embutida, criar conhecimento, adiar compromisso, entregar rápido, respeitar pessoas, otimizar o todo.</li>
</ul>
<h3>XP e excelência técnica</h3>
<ul>
<li><b>TDD:</b> teste antes do código. Ciclo vermelho → verde → refatorar.</li>
<li><b>Programação em par</b> (qualidade e disseminação de conhecimento), <b>integração contínua</b>, refatoração, design simples, propriedade coletiva do código, pequenos releases, padrões de código.</li>
<li><b>CI/CD e DevOps:</b> integração várias vezes ao dia com build e testes automatizados; entrega e deploy contínuos reduzem o trabalho parado.</li>
<li><b>BDD/ATDD:</b> testes de aceitação definidos junto com o negócio.</li>
</ul>
<h3>Estimativa</h3>
<ul>
<li><b>Story points:</b> estimativa relativa de esforço, complexidade e incerteza. Vale só dentro da equipe.</li>
<li><b>Planning poker</b> (Fibonacci): quando há divergência, os extremos explicam o raciocínio e a equipe estima de novo.</li>
<li><b>Affinity estimating, T-shirt sizing</b> para muitos itens rapidamente. Ideal days como alternativa.</li>
<li>Quem faz o trabalho estima.</li>
</ul>
<h3>Métricas</h3>
<table>
<tr><th>Métrica</th><th>Leitura</th></tr>
<tr><td>Velocidade</td><td>Pontos concluídos por iteração. Use a média para prever. <b>Não compare entre equipes</b></td></tr>
<tr><td>Throughput</td><td>Itens concluídos por período</td></tr>
<tr><td>Lead time / cycle time</td><td>Lead: do pedido até a entrega. Cycle: do início do trabalho até a conclusão</td></tr>
<tr><td>Lei de Little</td><td>Lead time médio = WIP ÷ throughput</td></tr>
<tr><td>Burndown</td><td>Trabalho restante. Linha plana: nada sendo concluído</td></tr>
<tr><td>Burnup</td><td>Trabalho concluído e escopo total; <b>mostra mudança de escopo</b></td></tr>
<tr><td>CFD</td><td>Faixas por etapa. Faixa que se alarga indica gargalo/WIP crescente; a distância horizontal é o lead time</td></tr>
<tr><td>Defeitos escapados</td><td>Defeitos encontrados após o release: indicador de qualidade</td></tr>
</table>
<h3>Qualidade, riscos e melhoria</h3>
<ul>
<li><b>Definition of Done:</b> o padrão de qualidade de todo incremento. Sem a DoD, o item não está pronto e não vai para a review como concluído.</li>
<li><b>Dívida técnica:</b> torne-a visível, coloque no backlog e reserve capacidade para pagá-la.</li>
<li><b>Spike:</b> pesquisa com timebox para reduzir incerteza técnica ou permitir estimar.</li>
<li><b>Backlog ajustado ao risco:</b> respostas a riscos viram itens do backlog. <b>Risk burndown chart</b> acompanha a exposição ao longo do tempo.</li>
<li><b>Retrospectivas:</b> poucas ações concretas, com responsável, acompanhadas na próxima retro. Varie os formatos (Start/Stop/Continue, 4Ls, Sailboat, 5 porquês, espinha de peixe).</li>
</ul>

let store={stats:{},sims:[]};

function save(){try{localStorage.setItem('acp-estudos-v1',JSON.stringify(store));}catch(e){}}
function record(id,ok){const s=store.stats[id]||{v:0,c:0,last:null};s.v++;if(ok)s.c++;s.last=ok;store.stats[id]=s;save();}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const prep=q=>({...q,order:shuffle([0,1,2,3]),pick:null});

let fc={dom:'all',deck:null,i:0,flip:false,ok:0,no:0};
function buildDeck(){fc.deck=shuffle(CARDS.filter(c=>fc.dom==='all'||c[0]===fc.dom));fc.i=0;fc.flip=false;fc.ok=0;fc.no=0;}
function flashcards(){
  if(!fc.deck)buildDeck();
  const c=fc.deck[fc.i];
  const chips=`<div class="chips" style="margin-bottom:16px"><button class="chip ${fc.dom==='all'?'on':''}" data-d="all">Todos</button>${Object.entries(DOM).map(([k,d])=>`<button class="chip ${k===fc.dom?'on':''}" data-d="${k}">${d.nome}</button>`).join('')}</div>`;
  if(!c){
    app.innerHTML=`<h1>Flashcards</h1>${chips}<div class="card"><h2>Rodada concluída</h2><p>Sabia: <b>${fc.ok}</b> · Revisar: <b>${fc.no}</b></p><button class="btn" id="again">Embaralhar de novo</button></div>`;
    $('#again').onclick=()=>{buildDeck();flashcards();};
  } else {
    app.innerHTML=`<h1>Flashcards</h1>${chips}
    <div class="row muted small" style="justify-content:space-between;margin-bottom:6px"><span>${fc.i+1} de ${fc.deck.length}</span><span>✓ ${fc.ok} · ↻ ${fc.no}</span></div>
    <div class="progress" style="margin-bottom:14px"><i style="width:${fc.i/fc.deck.length*100}%"></i></div>
    <div class="card flash" id="fcard" style="border-top:5px solid ${DOM[c[0]].cor}">
      <div style="margin-bottom:12px">${domTag(c[0])}</div>
      ${fc.flip?`<div class="def">${c[2]}</div><div class="muted small" style="margin-top:12px">${c[1]}</div>`:`<div class="term">${c[1]}</div><div class="muted small" style="margin-top:14px">toque para virar</div>`}
    </div>
    <div class="row" style="justify-content:center">
      ${fc.flip?`<button class="btn ghost" id="no">↻ Revisar depois</button><button class="btn" id="ok">✓ Eu sabia</button>`:`<button class="btn" id="flip">Virar</button>`}
    </div>`;
    const flip=()=>{fc.flip=!fc.flip;flashcards();};
    $('#fcard').onclick=flip; if($('#flip'))$('#flip').onclick=flip;
    if($('#ok'))$('#ok').onclick=()=>{fc.ok++;fc.i++;fc.flip=false;flashcards();};
    if($('#no'))$('#no').onclick=()=>{fc.no++;fc.deck.push(c);fc.i++;fc.flip=false;flashcards();};
  }
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{fc.dom=b.dataset.d;buildDeck();flashcards();});
}

let quizCfg={dom:'all',n:10}, quizState=null;
function quiz(){
  if(!quizState){
    const erros=Q.filter(q=>store.stats[q.id]&&store.stats[q.id].last===false).length;
    app.innerHTML=`<h1>Quiz</h1><p class="muted">Questões situacionais com explicação logo após cada resposta.</p>
    <div class="card">
      <h3 style="margin-top:0">Domínio</h3>
      <div class="chips"><button class="chip ${quizCfg.dom==='all'?'on':''}" data-d="all">Todos</button>${Object.entries(DOM).map(([k,d])=>`<button class="chip ${k===quizCfg.dom?'on':''}" data-d="${k}">${d.nome} (${Q.filter(q=>q.d===k).length})</button>`).join('')}<button class="chip ${quizCfg.dom==='erros'?'on':''}" data-d="erros" ${erros?'':'disabled'}>Só as que errei (${erros})</button></div>
      <h3>Quantidade</h3>
      <div class="chips">${[5,10,15].map(n=>`<button class="chip ${quizCfg.n===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
      <div style="margin-top:18px"><button class="btn" id="start">Começar</button></div>
    </div>`;
    app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{quizCfg.dom=b.dataset.d;quiz();});
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{quizCfg.n=+b.dataset.n;quiz();});
    $('#start').onclick=()=>{
      let pool=Q.filter(q=>quizCfg.dom==='all'||q.d===quizCfg.dom||(quizCfg.dom==='erros'&&store.stats[q.id]&&store.stats[q.id].last===false));
      quizState={qs:shuffle(pool).slice(0,quizCfg.n).map(prep),i:0,score:0};quiz();
    };
    return;
  }
  const st=quizState, q=st.qs[st.i];
  if(!q){
    app.innerHTML=`<h1>Quiz</h1><div class="card"><h2>Resultado</h2><div class="stat">${st.score}/${st.qs.length}</div><p class="muted">${Math.round(st.score/st.qs.length*100)}% de acerto</p><div class="row"><button class="btn" id="re">Novo quiz</button><a class="btn ghost" href="#resumos">Revisar resumos</a></div></div>`;
    $('#re').onclick=()=>{quizState=null;quiz();};return;
  }
  const answered=q.pick!==null;
  app.innerHTML=`<h1>Quiz</h1>
  <div class="row muted small" style="justify-content:space-between;margin-bottom:6px"><span>Questão ${st.i+1} de ${st.qs.length}</span><span>Acertos: ${st.score}</span></div>
  <div class="progress" style="margin-bottom:14px"><i style="width:${st.i/st.qs.length*100}%"></i></div>
  <div class="card">
    <div style="margin-bottom:10px">${domTag(q.d)}</div>
    <p style="font-weight:500;font-size:1.05rem">${q.q}</p>
    ${q.order.map(oi=>{let cls='';if(answered){if(oi===0)cls='right';else if(oi===q.pick)cls='wrong';}return `<button class="opt ${cls}" data-o="${oi}" ${answered?'disabled':''}>${q.o[oi]}</button>`;}).join('')}
    ${answered?`<div class="expl"><b>${q.pick===0?'✓ Correto.':'✗ Não foi dessa vez.'}</b> ${q.e}</div><div style="margin-top:14px"><button class="btn" id="next">${st.i+1<st.qs.length?'Próxima →':'Ver resultado'}</button></div>`:''}
  </div>
  <button class="btn ghost small" id="quit">Sair do quiz</button>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.pick=+b.dataset.o;const ok=q.pick===0;if(ok)st.score++;record(q.id,ok);quiz();});
  if($('#next'))$('#next').onclick=()=>{st.i++;quiz();window.scrollTo(0,0);};
  $('#quit').onclick=()=>{quizState=null;quiz();};
}

// ================== SIMULADO ==================
let sim=null, simN=40, timerH=null;
function compose(n){
  const per={};let tot=0;
  for(const k in DOM){per[k]=Math.min(Math.round(n*DOM[k].peso/100),Q.filter(q=>q.d===k).length);tot+=per[k];}
  const order=['delivery','mindset','leadership','product'];let i=0;
  while(tot<n&&i<40){const k=order[i%4];if(per[k]<Q.filter(q=>q.d===k).length){per[k]++;tot++;}i++;}
  while(tot>n){const k=order[i%4];if(per[k]>0){per[k]--;tot--;}i++;}
  let out=[];for(const k in per)out=out.concat(shuffle(Q.filter(q=>q.d===k)).slice(0,per[k]));
  return shuffle(out).map(q=>({...prep(q),flag:false}));
}
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),ss=s%60;return `${m}:${String(ss).padStart(2,'0')}`;};
function tick(){
  if(!sim||sim.done)return;
  const left=Math.round((sim.end-Date.now())/1000);
  const el=$('#tmr'); if(el){el.textContent=fmt(left);el.style.color=left<300?'var(--bad)':'';}
  if(left<=0)finishSim();
}
function simulado(){
  if(!sim){
    const sizes=[[20,'Rápido'],[40,'Médio'],[Q.length,'Banco completo']];
    app.innerHTML=`<h1>Simulado</h1><p class="muted">Questões sorteadas na proporção oficial dos domínios, com o mesmo ritmo da prova real: 1,5 minuto por questão. A explicação só aparece no final.</p>
    <div class="card"><h3 style="margin-top:0">Tamanho</h3>
    <div class="chips">${sizes.map(([n,l])=>`<button class="chip ${simN===n?'on':''}" data-n="${n}">${l} · ${n} questões · ${Math.round(n*1.5)} min</button>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn" id="go">Iniciar simulado</button></div></div>
    ${store.sims.length?`<div class="card"><h3 style="margin-top:0">Últimos simulados</h3>${store.sims.slice(-5).reverse().map(s=>`<div class="row small" style="justify-content:space-between;border-top:1px solid var(--line);padding:6px 0"><span>${new Date(s.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span><span>${s.n} questões</span><b>${s.pct}%</b></div>`).join('')}</div>`:''}`;
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{simN=+b.dataset.n;simulado();});
    $('#go').onclick=()=>{const qs=compose(simN);sim={qs,i:0,end:Date.now()+qs.length*90000,done:false};clearInterval(timerH);timerH=setInterval(tick,1000);simulado();};
    return;
  }
  if(sim.done)return simResult();
  const q=sim.qs[sim.i], nAns=sim.qs.filter(x=>x.pick!==null).length;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="margin:0">Simulado</h1><span class="timer">⏱ <span id="tmr">--:--</span></span></div>
  <p class="muted small">${nAns} de ${sim.qs.length} respondidas</p>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Questão ${sim.i+1}</b><button class="chip ${q.flag?'on':''}" id="flag">⚑ ${q.flag?'Marcada':'Marcar para revisão'}</button></div>
    <p style="font-weight:500;font-size:1.05rem">${q.q}</p>
    ${q.order.map(oi=>`<button class="opt ${q.pick===oi?'sel':''}" data-o="${oi}">${q.o[oi]}</button>`).join('')}
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <button class="btn ghost" id="prev" ${sim.i===0?'disabled':''}>← Anterior</button>
      ${sim.i+1<sim.qs.length?`<button class="btn" id="nxt">Próxima →</button>`:`<button class="btn" id="fin2">Finalizar</button>`}
    </div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><b class="small">Navegação</b><button class="btn ghost small" id="fin">Finalizar simulado</button></div>
  <div class="qnav">${sim.qs.map((x,j)=>`<button data-j="${j}" class="${x.pick!==null?'ans':''} ${j===sim.i?'cur':''} ${x.flag?'flag':''}">${j+1}</button>`).join('')}</div></div>`;
  tick();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.pick=+b.dataset.o;simulado();});
  $('#flag').onclick=()=>{q.flag=!q.flag;simulado();};
  $('#prev').onclick=()=>{sim.i--;simulado();};
  if($('#nxt'))$('#nxt').onclick=()=>{sim.i++;simulado();};
  app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{sim.i=+b.dataset.j;simulado();});
  const ask=()=>{const left=sim.qs.length-sim.qs.filter(x=>x.pick!==null).length;
    modal(`<h3 style="margin-top:0">Finalizar o simulado?</h3><p>${left?`Ainda há <b>${left}</b> questão(ões) sem resposta.`:'Todas as questões foram respondidas.'}</p><div class="row"><button class="btn" id="mYes">Finalizar</button><button class="btn ghost" id="mNo">Continuar</button></div>`);
    $('#mYes').onclick=()=>{modal('');finishSim();};$('#mNo').onclick=()=>modal('');};
  $('#fin').onclick=ask; if($('#fin2'))$('#fin2').onclick=ask;
}
function finishSim(){
  if(!sim||sim.done)return;
  sim.done=true;clearInterval(timerH);
  sim.qs.forEach(q=>{if(q.pick!==null)record(q.id,q.pick===0);});
  const ok=sim.qs.filter(q=>q.pick===0).length;
  sim.pct=Math.round(ok/sim.qs.length*100);
  store.sims.push({t:Date.now(),n:sim.qs.length,pct:sim.pct});store.sims=store.sims.slice(-30);save();
  if(location.hash!=='#simulado')location.hash='simulado';else simulado();
}
function simResult(){
  const by={};for(const k in DOM)by[k]={t:0,c:0};
  sim.qs.forEach(q=>{by[q.d].t++;if(q.pick===0)by[q.d].c++;});
  const ok=sim.qs.filter(q=>q.pick===0).length;
  app.innerHTML=`<h1>Resultado do simulado</h1>
  <div class="card"><div class="grid"><div><div class="stat">${sim.pct}%</div><div class="muted small">${ok} de ${sim.qs.length} corretas</div></div>
  <div class="small muted" style="align-self:center">O PMI não divulga nota de corte. Use cerca de 70–75% nos simulados como sinal de que você está pronta e veja abaixo em quais domínios focar.</div></div>
  <div style="margin-top:12px">${Object.entries(by).filter(([k,v])=>v.t).map(([k,v])=>{const p=Math.round(v.c/v.t*100);return `<div class="dbar"><span>${domTag(k)}</span><div class="progress"><i style="width:${p}%;background:${DOM[k].cor}"></i></div><b>${p}%</b></div>`;}).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" id="new">Novo simulado</button><button class="btn ghost" id="onlyWrong">Mostrar só os erros</button></div></div>
  <div class="card" id="revlist"></div>`;
  let onlyWrong=false;
  const draw=()=>{$('#revlist').innerHTML='<h2>Revisão</h2>'+sim.qs.map((q,j)=>({q,j})).filter(({q})=>!onlyWrong||q.pick!==0).map(({q,j})=>`
    <div class="rev"><div class="row" style="margin-bottom:6px"><b>${j+1}.</b> ${domTag(q.d)} ${q.pick===0?'<span style="color:var(--ok)">✓</span>':q.pick===null?'<span class="muted">sem resposta</span>':'<span style="color:var(--bad)">✗</span>'}</div>
    <p style="margin:.3em 0;font-weight:500">${q.q}</p>
    ${q.pick!==null&&q.pick!==0?`<p class="small" style="color:var(--bad);margin:.2em 0">Sua resposta: ${q.o[q.pick]}</p>`:''}
    <p class="small" style="color:var(--ok);margin:.2em 0">Correta: ${q.o[0]}</p>
    <div class="expl small">${q.e}</div></div>`).join('');};
  draw();
  $('#onlyWrong').onclick=()=>{onlyWrong=!onlyWrong;$('#onlyWrong').textContent=onlyWrong?'Mostrar todas':'Mostrar só os erros';draw();};
  $('#new').onclick=()=>{sim=null;simulado();};
}

// ================== DESEMPENHO ==================
function desempenho(){
  const by={};for(const k in DOM)by[k]={tot:Q.filter(q=>q.d===k).length,seen:0,ok:0};
  Q.forEach(q=>{const s=store.stats[q.id];if(s){by[q.d].seen++;if(s.last)by[q.d].ok++;}});
  const weakest=Object.entries(by).filter(([k,v])=>v.seen).sort((a,b)=>a[1].ok/a[1].seen-b[1].ok/b[1].seen)[0];
  app.innerHTML=`<h1>Desempenho</h1><p class="muted small">Fica salvo neste navegador. Considera a última resposta dada a cada questão.</p>
  <div class="card"><h3 style="margin-top:0">Acerto por domínio</h3>
  ${Object.entries(by).map(([k,v])=>{const p=v.seen?Math.round(v.ok/v.seen*100):0;return `<div class="dbar"><span>${domTag(k)}</span><div class="progress"><i style="width:${p}%;background:${DOM[k].cor}"></i></div><b>${v.seen?p+'%':'—'}</b></div><div class="small muted" style="margin:-4px 0 8px 120px">${v.seen} de ${v.tot} questões vistas</div>`;}).join('')}
  ${weakest?`<div class="tip">Foco sugerido: <b>${DOM[weakest[0]].nome}</b>. <a href="#resumos" id="toWeak">Rever o resumo</a> e depois refazer as questões que errou no quiz.</div>`:'<p class="muted">Responda algumas questões no quiz ou no simulado para ver seu desempenho.</p>'}
  </div>
  ${store.sims.length?`<div class="card"><h3 style="margin-top:0">Evolução nos simulados</h3><div style="display:flex;align-items:flex-end;gap:6px;height:140px;border-bottom:1px solid var(--line);padding-top:10px">${store.sims.slice(-15).map(s=>`<div title="${s.pct}%" style="flex:1;background:var(--ink);opacity:.8;height:${Math.max(4,s.pct)}%;border-radius:4px 4px 0 0"></div>`).join('')}</div><p class="small muted">Últimos ${Math.min(15,store.sims.length)} simulados (% de acerto)</p></div>`:''}
  <button class="btn ghost" id="reset">Zerar progresso</button>`;
  if($('#toWeak'))$('#toWeak').onclick=()=>{resDom=weakest[0];};
  $('#reset').onclick=()=>{modal(`<h3 style="margin-top:0">Zerar todo o progresso?</h3><p>Apaga as estatísticas e o histórico de simulados deste navegador.</p><div class="row"><button class="btn" id="mYes">Zerar</button><button class="btn ghost" id="mNo">Cancelar</button></div>`);
    $('#mYes').onclick=()=>{store={stats:{},sims:[]};save();modal('');desempenho();};$('#mNo').onclick=()=>modal('');};
}

route();
</script>
